<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطاعم ومطابخ ميدان العوالي</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- الخط العربي -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- CSS المخصص -->
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
        .navbar, .footer {
            background-color: #FF5722;
        }
        .card {
            transition: transform 0.3s;
        }
        .card:hover {
            transform: translateY(-10px);
        }
    </style>
</head>
<body>
    <!-- شريط التنقل -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">مطعمنا</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#menu">قائمة الطعام</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#reservation">الحجوزات</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contact">اتصل بنا</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- الهيدر -->
    <header class="bg-dark text-white text-center py-5">
        <h1>مرحبًا بكم في مطعمنا</h1>
        <p>نقدم لكم أفضل الأطباق بأجواء مميزة</p>
    </header>

    <!-- قائمة الطعام -->
    <section id="menu" class="container my-5">
        <h2 class="text-center mb-4">قائمة الطعام</h2>
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="https://ibb.co/PG9rVvd8/300x200" class="card-img-top" alt="ستيك لحم">
                    <div class="card-body">
                        <h5 class="card-title">ستيك لحم</h5>
                        <p class="card-text">السعرات الحرارية: 450 سعرة</p>
                        <button class="btn btn-primary" onclick="addToCart('ستيك لحم', 450)">أضف إلى العربة</button>
                    </div>
                </div>
            </div>
            <!-- أضف المزيد من الأصناف هنا -->
        </div>
    </section>

    <!-- قسم الحجوزات -->
    <section id="reservation" class="bg-light py-5">
        <div class="container">
            <h2 class="text-center mb-4">احجز طاولتك</h2>
            <form>
                <div class="mb-3">
                    <label for="name" class="form-label">الاسم</label>
                    <input type="text" class="form-control" id="name" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">رقم الهاتف</label>
                    <input type="tel" class="form-control" id="phone" required>
                </div>
                <div class="mb-3">
                    <label for="date" class="form-label">التاريخ</label>
                    <input type="date" class="form-control" id="date" required>
                </div>
                <button type="submit" class="btn btn-primary">احجز الآن</button>
            </form>
        </div>
    </section>

    <!-- عربة التسوق -->
    <section id="cart" class="container my-5">
        <h2 class="text-center mb-4">عربة التسوق</h2>
        <ul id="cartItems" class="list-group">
            <!-- العناصر ستظهر هنا -->
        </ul>
        <button class="btn btn-danger mt-3" onclick="clearCart()">إفراغ العربة</button>
    </section>

    <!-- اتصل بنا -->
    <section id="contact" class="bg-light py-5">
        <div class="container">
            <h2 class="text-center mb-4">اتصل بنا</h2>
            <form>
                <div class="mb-3">
                    <label for="contactName" class="form-label">الاسم</label>
                    <input type="text" class="form-control" id="contactName" required>
                </div>
                <div class="mb-3">
                    <label for="contactEmail" class="form-label">البريد الإلكتروني</label>
                    <input type="email" class="form-control" id="contactEmail" required>
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label">الرسالة</label>
                    <textarea class="form-control" id="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">إرسال</button>
            </form>
        </div>
    </section>

    <!-- الفوتر -->
    <footer class="footer text-white text-center py-3">
        <p>جميع الحقوق محفوظة &copy; 2023 مطعمنا</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript المخصص -->
    <script>
        let cart = [];

        function addToCart(item, calories) {
            cart.push({ item, calories });
            updateCart();
        }

        function updateCart() {
            const cartItems = document.getElementById('cartItems');
            cartItems.innerHTML = '';
            cart.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'list-group-item';
                li.textContent = `${item.item} - ${item.calories} سعرة`;
                cartItems.appendChild(li);
            });
        }

        function clearCart() {
            cart = [];
            updateCart();
        }
    </script>
</body>
</html>
